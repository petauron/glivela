name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection-runtime:
    name: Reviewed target-selection runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate generated composite configuration with official Xray
        env:
          GLIVELA_XRAY_IMAGE: ghcr.io/xtls/xray-core:26.7.28@sha256:b697cda1588faca696ab7f7755dd1161f60862af3ff6026300e44cff6aedd558
        run: |
          docker pull "$GLIVELA_XRAY_IMAGE"
          go test -run '^TestCompositeOfficialCoreConfiguration$' -count=1 .
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Run complete tests with version-based race policy
        run: |
          version=$(jq -er '.["."] | select(type == "string")' .release-please-manifest.json)
          set --
          case "$version" in
            *-alpha|*-alpha.*) echo "Alpha CI: full tests, race disabled" ;;
            *) set -- -race ;;
          esac
          go test "$@" ./... -count=1
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: petauron/vastora
          ref: c85888a7d98717fdd4143dd4c70f022f6563632c
          path: vastora
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            vastora/web/package-lock.json
      - name: Install reviewed UI dependencies
        run: |
          npm ci --prefix vastora/web
          npm ci --prefix ui
      - name: Audit application dependencies
        run: npm audit --prefix ui --audit-level=high
      - name: Verify app interface
        env:
          VASTORA_WEB_SOURCE: ${{ github.workspace }}/vastora/web/src
        run: |
          npm run check --prefix ui
          npm test --prefix ui
      - name: Build independently delivered UI
        id: ui_bundle
        env:
          VASTORA_WEB_SOURCE: ${{ github.workspace }}/vastora/web/src
        run: |
          npm run build --prefix ui
          version=$(jq -er .version ui/package.json)
          bundle="ui/dist/ui-meridian-$version"
          test -s "$bundle.js"
          test -s "$bundle.css"
          test "$(wc -c < "$bundle.js")" -le 4194304
          test "$(wc -c < "$bundle.css")" -le 4194304
          ! grep -Fq 'process.env.NODE_ENV' "$bundle.js"
          echo "version=$version" >> "$GITHUB_OUTPUT"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.scope.outputs.go }}
      ui: ${{ steps.scope.outputs.ui }}
      native: ${{ steps.scope.outputs.native }}
      selection: ${{ steps.scope.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine CI scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          parse_scope() {
            while IFS='=' read -r key value; do
              case "$key" in
                go) go="$value" ;;
                ui) ui="$value" ;;
                native) native="$value" ;;
                selection) selection="$value" ;;
              esac
            done <<EOF
          $1
          EOF
          }
          go=true; ui=true; native=true; selection=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            scope_out=$(sh scripts/classify-ci-changes.sh --git "$BASE_SHA" "$HEAD_SHA")
            parse_scope "$scope_out"
          elif [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            scope_out=$(sh scripts/classify-ci-changes.sh --git "$BEFORE_SHA" "$GITHUB_SHA")
            parse_scope "$scope_out"
            if [ "$go" = "true" ] || [ "$ui" = "true" ] || [ "$native" = "true" ] || [ "$selection" = "true" ]; then
              main_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
              pr_head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .merge_commit_sha == "'"$GITHUB_SHA"'" and .base.ref == "main" and .head.repo.full_name == "'"$GITHUB_REPOSITORY"'")] | if length == 1 then .[0].head.sha else empty end' 2>/dev/null || true)
              if [ -n "$pr_head" ]; then
                pr_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$pr_head" --jq '.tree.sha // empty' 2>/dev/null || true)
                pr_ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$pr_head&per_page=100" --jq '.workflow_runs | sort_by(.run_number) | last | if . != null and .head_sha == "'"$pr_head"'" and .head_repository.full_name == "'"$GITHUB_REPOSITORY"'" and .status == "completed" and .conclusion == "success" then "ok" else empty end' 2>/dev/null || true)
                if [ "$pr_tree" = "$main_tree" ] && [ "$pr_ci" = "ok" ]; then
                  go=false; ui=false; native=false; selection=false
                fi
              fi
            fi
          fi
          printf 'go=%s\nui=%s\nnative=%s\nselection=%s\n' "$go" "$ui" "$native" "$selection" >> "$GITHUB_OUTPUT"

  native-package:
    name: Native runtime distribution
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install existing isolated runtime test tools
        run: sh scripts/install-ci-runtime-tools.sh dnsmasq-base iproute2 nftables
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/legacy-export/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Cache verified pinned upstream release inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/glivela-upstream-cache
          key: glivela-upstream-v1-${{ hashFiles('scripts/build-native-release.sh') }}
      - name: Install reviewed management UI dependencies
        run: npm ci --prefix ui
      - name: Build twice and compare immutable distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GLIVELA_UPSTREAM_CACHE_DIR: ${{ runner.temp }}/glivela-upstream-cache
        run: |
          sh scripts/build-native-release.sh "$RUNNER_TEMP/native-first"
          sh scripts/build-native-release.sh "$RUNNER_TEMP/native-second"
          diff -r "$RUNNER_TEMP/native-first" "$RUNNER_TEMP/native-second"
          cd "$RUNNER_TEMP/native-first"
          sha256sum --check SHA256SUMS
      - name: Exercise bundled official core over verified TLS
        run: |
          version=$(jq -er '.["."]' .release-please-manifest.json)
          mkdir "$RUNNER_TEMP/native-runtime"
          tar -xzf "$RUNNER_TEMP/native-first/glivela-$version-linux-amd64.tar.gz" -C "$RUNNER_TEMP/native-runtime"
          "$RUNNER_TEMP/native-runtime/glivela" -help
          GLIVELA_DISTRIBUTION="$RUNNER_TEMP/native-runtime" GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" go test ./control -run '^TestOfficialXray(ValidationAndTLS|EntryPlanValidation)$' -count=1 -v
          GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" go test ./landing -run '^TestOfficial(Landing|DualEgressLanding)Configuration$' -count=1 -v
      - name: Verify bundled iperf3 authentication on loopback
        run: |
          set -eu
          tool="$RUNNER_TEMP/native-runtime/iperf3"
          "$tool" --version > "$RUNNER_TEMP/iperf-version"
          grep -Eq '^iperf 3\.22([[:space:]]|$)' "$RUNNER_TEMP/iperf-version"
          "$tool" --help > "$RUNNER_TEMP/iperf-help"
          grep -Fq -- '--rsa-private-key-path' "$RUNNER_TEMP/iperf-help"
          grep -Fq -- '--bind-dev' "$RUNNER_TEMP/iperf-help"
          dir="$RUNNER_TEMP/iperf-auth"
          mkdir -m 700 "$dir"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$dir/private.pem" >/dev/null 2>&1
          openssl pkey -in "$dir/private.pem" -pubout -out "$dir/public.pem" >/dev/null 2>&1
          printf 'speed,%s\n' "$(printf '{speed}local-fixture' | sha256sum | cut -d ' ' -f 1)" > "$dir/users.csv"
          "$tool" -s -1 -4 -B 127.0.0.1 -p 34271 --rsa-private-key-path "$dir/private.pem" --authorized-users-path "$dir/users.csv" > "$dir/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if ss -H -ltn 'sport = :34271' | grep -q '127.0.0.1:34271'; then ready=true; break; fi
            sleep 0.2
          done
          test "$ready" = true
          IPERF3_PASSWORD=local-fixture timeout 15 "$tool" -c 127.0.0.1 -4 -p 34271 -n 32768 --username speed --rsa-public-key-path "$dir/public.pem" -J > "$dir/result.json"
          jq -e '.end.sum_received.bytes > 0' "$dir/result.json" >/dev/null
          wait "$server"
      - name: Exercise actual landing DNS policy in isolated namespace
        run: |
          set -eu
          go test -c -o "$RUNNER_TEMP/glivela-dns.test" ./landing
          pids=""
          run_case() {
            name="$1"; shift
            log="$RUNNER_TEMP/landing-$name.log"
            "$@" > "$log" 2>&1 &
            pids="$pids $!:$name:$log"
          }
          wait_cases() {
            failed=0
            for entry in $pids; do
              pid=${entry%%:*}
              rest=${entry#*:}
              name=${rest%%:*}
              log=${rest#*:}
              status=0
              wait "$pid" || status=$?
              echo "=== $name ==="
              cat "$log"
              rm -f "$log"
              if [ "$status" -ne 0 ]; then
                echo "$name failed with exit status $status" >&2
                failed=1
              fi
            done
            pids=""
            test "$failed" -eq 0
          }
          run_case dns-dual sudo env GLIVELA_LANDING_DNS_TEST=1 GLIVELA_LANDING_FAMILY=dual GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingDNSAndTLS$' -test.v -test.timeout 45s
          run_case dns-ipv6 sudo env GLIVELA_LANDING_DNS_TEST=1 GLIVELA_LANDING_FAMILY=ipv6 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingDNSAndTLS$' -test.v -test.timeout 45s
          run_case dns-ipv4 sudo env GLIVELA_LANDING_DNS_TEST=1 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingDNSAndTLS$' -test.v -test.timeout 45s
          run_case udp-direct sudo env GLIVELA_LANDING_UDP_TEST=1 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingUDP$' -test.v -test.timeout 50s
          wait_cases
          run_case udp-tcp-main-ipv4 sudo env GLIVELA_LANDING_UDP_TEST=1 GLIVELA_UDP_LISTENER=main GLIVELA_UDP_EGRESS_FAMILY=ipv4 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingUDPOverTCP$' -test.v -test.timeout 45s
          run_case udp-tcp-main-ipv6 sudo env GLIVELA_LANDING_UDP_TEST=1 GLIVELA_UDP_LISTENER=main GLIVELA_UDP_EGRESS_FAMILY=ipv6 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingUDPOverTCP$' -test.v -test.timeout 45s
          run_case udp-tcp-shared-ipv4 sudo env GLIVELA_LANDING_UDP_TEST=1 GLIVELA_UDP_LISTENER=shared GLIVELA_UDP_EGRESS_FAMILY=ipv4 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingUDPOverTCP$' -test.v -test.timeout 45s
          run_case udp-tcp-shared-ipv6 sudo env GLIVELA_LANDING_UDP_TEST=1 GLIVELA_UDP_LISTENER=shared GLIVELA_UDP_EGRESS_FAMILY=ipv6 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingUDPOverTCP$' -test.v -test.timeout 45s
          wait_cases
          run_case udp-tcp-ipv6-ipv4 sudo env GLIVELA_LANDING_UDP_TEST=1 GLIVELA_UDP_LISTENER=ipv6 GLIVELA_UDP_EGRESS_FAMILY=ipv4 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingUDPOverTCP$' -test.v -test.timeout 45s
          run_case udp-tcp-ipv6-ipv6 sudo env GLIVELA_LANDING_UDP_TEST=1 GLIVELA_UDP_LISTENER=ipv6 GLIVELA_UDP_EGRESS_FAMILY=ipv6 GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net "$RUNNER_TEMP/glivela-dns.test" -test.run '^TestRenderedLandingUDPOverTCP$' -test.v -test.timeout 45s
          wait_cases
      - name: Verify actual entry account authentication in isolated namespace
        run: |
          set -eu
          go test -c -o "$RUNNER_TEMP/glivela-entry-auth.test" ./control
          pids=""
          run_case() {
            name="$1"; shift
            log="$RUNNER_TEMP/entry-$name.log"
            "$@" > "$log" 2>&1 &
            pids="$pids $!:$name:$log"
          }
          wait_cases() {
            failed=0
            for entry in $pids; do
              pid=${entry%%:*}
              rest=${entry#*:}
              name=${rest%%:*}
              log=${rest#*:}
              status=0
              wait "$pid" || status=$?
              echo "=== $name ==="
              cat "$log"
              rm -f "$log"
              if [ "$status" -ne 0 ]; then
                echo "$name failed with exit status $status" >&2
                failed=1
              fi
            done
            pids=""
            test "$failed" -eq 0
          }
          run_case entry-auth sudo env GLIVELA_ENTRY_AUTH_TEST=1 GLIVELA_DISTRIBUTION="$RUNNER_TEMP/native-runtime" GLIVELA_XRAY_BINARY="$RUNNER_TEMP/native-runtime/xray" unshare --net --mount --propagation private "$RUNNER_TEMP/glivela-entry-auth.test" -test.run '^TestRenderedEntryAccountAuthentication$' -test.v -test.timeout 100s
          run_case entry-firewall sudo env GLIVELA_KERNEL_FIREWALL_TEST=1 unshare --net "$RUNNER_TEMP/glivela-entry-auth.test" -test.run '^TestEntry(StartupPeerIsolation|DriverDirectReadinessWithUnavailableLanding)$' -test.v -test.timeout 45s
          run_case ss2022-probe sudo env GLIVELA_TEST_XRAY="$RUNNER_TEMP/native-runtime/xray" GLIVELA_TEST_TRANSPORT_FENCE=1 unshare --net sh -c 'ip link set lo up; exec "$1" -test.run "^TestSS2022ProbeWithOfficialCore$" -test.v -test.timeout 45s' sh "$RUNNER_TEMP/glivela-entry-auth.test"
          wait_cases
  selection-runtime:
    name: Reviewed target-selection runtime
    needs: changes
    if: needs.changes.outputs.selection == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate generated composite configuration with official Xray
        env:
          GLIVELA_XRAY_IMAGE: ghcr.io/xtls/xray-core:26.10.31@sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9
        run: |
          docker pull "$GLIVELA_XRAY_IMAGE"
          go test -run '^TestCompositeOfficialCoreConfiguration$' -count=1 .
  verify:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/legacy-export/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify CI and release workflow policies
        run: sh scripts/test-ci-workflows.sh
      - name: Vet
        run: go vet ./...
      - name: Verify isolated offline migration tool
        working-directory: tools/legacy-export
        run: |
          go mod verify
          go vet ./...
          go test ./... -count=1
      - name: Keep SQLite out of runtime dependencies
        run: |
          go list -deps ./cmd/glivela > "$RUNNER_TEMP/glivela-runtime-deps"
          if grep -q '^modernc.org/' "$RUNNER_TEMP/glivela-runtime-deps"; then
            echo 'Offline-only dependencies leaked into the runtime'
            exit 1
          fi
      - name: Verify native firewall in isolated network namespace
        run: |
          set -eu
          sh scripts/install-ci-runtime-tools.sh nftables iproute2
          go test -c -o "$RUNNER_TEMP/glivela-landing.test" ./landing
          go test -c -o "$RUNNER_TEMP/glivela-entry-control.test" ./control
          pids=""
          run_case() {
            name="$1"; shift
            log="$RUNNER_TEMP/fw-$name.log"
            "$@" > "$log" 2>&1 &
            pids="$pids $!:$name:$log"
          }
          wait_cases() {
            failed=0
            for entry in $pids; do
              pid=${entry%%:*}
              rest=${entry#*:}
              name=${rest%%:*}
              log=${rest#*:}
              status=0
              wait "$pid" || status=$?
              echo "=== $name ==="
              cat "$log"
              rm -f "$log"
              if [ "$status" -ne 0 ]; then
                echo "$name failed with exit status $status" >&2
                failed=1
              fi
            done
            pids=""
            test "$failed" -eq 0
          }
          run_case firewall-lifecycle sudo env GLIVELA_KERNEL_FIREWALL_TEST=1 unshare --net "$RUNNER_TEMP/glivela-landing.test" -test.run '^TestKernelFirewallLifecycle$' -test.v -test.timeout 30s
          run_case entry-gate-lifecycle sudo env GLIVELA_KERNEL_FIREWALL_TEST=1 unshare --net "$RUNNER_TEMP/glivela-landing.test" -test.run '^TestKernelEntryGateLifecycle$' -test.v -test.timeout 45s
          run_case entry-driver-blocked sudo env GLIVELA_ENTRY_RUNTIME_KERNEL_TEST=1 unshare --net "$RUNNER_TEMP/glivela-entry-control.test" -test.run '^TestKernelEntryDriverBlockedPeerAndNodeResume$' -test.v -test.timeout 45s
          wait_cases
      - name: Run complete tests with race detection
        run: go test -race ./... -count=1
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install reviewed UI dependencies
        run: |
          npm ci --prefix ui
      - name: Audit application dependencies
        run: npm audit --prefix ui --audit-level=high
      - name: Verify app interface
        run: |
          npm run check --prefix ui
          npm test --prefix ui
      - name: Build independently delivered UI
        id: ui_bundle
        run: |
          npm run build --prefix ui
          version=$(jq -er .version ui/package.json)
          bundle="ui/dist/ui-glivela-$version"
          test -s "$bundle.js"
          test -s "$bundle.css"
          test "$(wc -c < "$bundle.js")" -le 4194304
          test "$(wc -c < "$bundle.css")" -le 4194304
          ! grep -Fq 'process.env.NODE_ENV' "$bundle.js"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  gate:
    name: CI / gate
    needs: [changes, native-package, selection-runtime, verify, ui]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable CI job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_ENABLED: ${{ needs.changes.outputs.native }}
          NATIVE_RESULT: ${{ needs.native-package.result }}
          SELECTION_ENABLED: ${{ needs.changes.outputs.selection }}
          SELECTION_RESULT: ${{ needs.selection-runtime.result }}
          VERIFY_ENABLED: ${{ needs.changes.outputs.go }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          UI_ENABLED: ${{ needs.changes.outputs.ui }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          set -eu
          test "$CHANGES_RESULT" = success
          check_job() {
            enabled="$1"
            result="$2"
            case "$enabled" in
              true) test "$result" = success ;;
              false) test "$result" = skipped ;;
              *) echo "Unexpected classifier flag: ${enabled:-<empty>}" >&2; exit 1 ;;
            esac
          }
          check_job "$NATIVE_ENABLED" "$NATIVE_RESULT"
          check_job "$SELECTION_ENABLED" "$SELECTION_RESULT"
          check_job "$VERIFY_ENABLED" "$VERIFY_RESULT"
          check_job "$UI_ENABLED" "$UI_RESULT"
